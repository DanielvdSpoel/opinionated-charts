version: 2
updates:
  # Keep the action versions in .github/workflows up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      # One PR for all routine action bumps instead of one per action.
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
