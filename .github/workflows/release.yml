name: Release charts

# Publishes each chart to the GitHub Container Registry as an OCI artifact when
# its version in Chart.yaml is bumped. Re-running with an unchanged version is a
# no-op, so it's safe to run on every push to main.

on:
  push:
    branches: [main]
    paths:
      - 'charts/**'
  workflow_dispatch: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create release tags
      packages: write   # push OCI charts to ghcr
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v5
        with:
          version: v3.16.4

      - name: Log in to ghcr
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package and push changed charts
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          registry="oci://ghcr.io/${owner}/charts"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          published=0
          for dir in charts/*/; do
            name="$(yq '.name' "${dir}Chart.yaml")"
            version="$(yq '.version' "${dir}Chart.yaml")"
            tag="${name}-${version}"

            if helm show chart "${registry}/${name}" --version "${version}" >/dev/null 2>&1; then
              echo "✓ ${name} ${version} already published — skipping"
              continue
            fi

            echo "→ publishing ${name} ${version}"
            helm package "$dir" --destination /tmp/pkg
            helm push "/tmp/pkg/${name}-${version}.tgz" "$registry"

            git tag -a "$tag" -m "${name} ${version}"
            git push origin "refs/tags/${tag}"
            published=$((published + 1))
          done

          echo "Published ${published} chart(s)."
